<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
    <nav>
        <a href="home.html"><img class="logo" src="Images/logo.png" alt="logo" /></a>

        <div class="nav-search">
            <input id="navSearchInput" type="text" placeholder="Search recipes..." />
            <button id="navSearchBtn" type="submit">Search</button>
        </div>

        <div class="header_links">
            <a href="about.html">About Us</a>

        <span >
       <strong>welcome, {{request.user.username}} </strong>

        {% endif %}
